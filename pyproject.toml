[project]
name = "retailpilot"
version = "0.1.0"
description = "RetailPilot local retail analytics workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "cryptography>=43,<47",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
